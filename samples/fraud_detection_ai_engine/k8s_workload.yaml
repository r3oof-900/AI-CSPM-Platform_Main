apiVersion: v1
kind: Namespace
metadata:
  name: fraud-analytics
  labels:
    tier: machine-learning
    criticality: high

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fraud-detector-sa
  namespace: fraud-analytics
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::444555666777:role/fraud_detection_ai_role
    eks.amazonaws.com/token-expiration: "86400"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-inference-engine
  namespace: fraud-analytics
  labels:
    app: fraud-detector
    workload-tier: ai-inference
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fraud-detector
  template:
    metadata:
      labels:
        app: fraud-detector
    spec:
      serviceAccountName: fraud-detector-sa
      containers:
      - name: xgboost-model-runner
        image: custom-fraud-ml:v2.4
        ports:
        - containerPort: 8443
          name: https-api
        env:
        - name: TARGET_KMS_KEY
          value: "fraud_models_cmk"
        - name: FEATURE_STORE_BUCKET
          value: "fraud-feature-store-444555666777"
        resources:
          limits:
            cpu: "2000m"
            memory: "4Gi"
          requests:
            cpu: "1000m"
            memory: "2Gi"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: feature-store-secrets-reader
  namespace: fraud-analytics
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fraud-detector-secrets-binding
  namespace: fraud-analytics
subjects:
- kind: ServiceAccount
  name: fraud-detector-sa
  namespace: fraud-analytics
roleRef:
  kind: Role
  name: feature-store-secrets-reader
  apiGroup: rbac.authorization.k8s.io
