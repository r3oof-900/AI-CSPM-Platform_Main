apiVersion: v1
kind: Namespace
metadata:
  name: production
  labels:
    environment: production
    compliance: pci-dss

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-service-sa
  namespace: production
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/component: backend-processor
  annotations:
    # IRSA (IAM Roles for Service Accounts) Annotation
    # Links this in-cluster ServiceAccount to the AWS IAM Role
    eks.amazonaws.com/role-arn: arn:aws:iam::853679583136:role/eks-payment-kms-role
    eks.amazonaws.com/sts-regional-endpoints: "true"
    eks.amazonaws.com/token-expiration: "86400"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-processor-deployment
  namespace: production
  labels:
    app: payment-processor
    tier: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-processor
  template:
    metadata:
      labels:
        app: payment-processor
        tier: api-gateway
    spec:
      serviceAccountName: payment-service-sa
      containers:
      - name: payment-api
        image: nginx:1.25-alpine
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: AWS_REGION
          value: "us-east-1"
        - name: TARGET_KMS_KEY_ALIAS
          value: "alias/payment-vault-cmk"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 10001
          capabilities:
            drop:
            - ALL

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: payment-secrets-reader
  namespace: production
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: payment-sa-secrets-binding
  namespace: production
subjects:
- kind: ServiceAccount
  name: payment-service-sa
  namespace: production
roleRef:
  kind: Role
  name: payment-secrets-reader
  apiGroup: rbac.authorization.k8s.io
